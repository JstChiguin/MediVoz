<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MediVoz — Transcriptor Médico</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-icon">🩺</div>
    <div class="brand-text">
      <h1>MediVoz</h1>
      <p>Transcriptor Médico</p>
    </div>
  </div>
</header>

<div class="card">
  <div class="doctor-bar">
    <label>Doctor</label>
    <select id="doctorSelect">
      <option value="">— Seleccionar médico —</option>
      <option>Dr. Marcelo Alarcón Bastías</option>
      <option>Dra. Ximena Barbageliata García</option>
      <option>Dr. Álvaro Carrizo Arredondo</option>
      <option>Dr. Osvaldo Segundo Cisternas Vásquez</option>
      <option>Dra. Paulina Codoceo Collao</option>
      <option>Dr. Álvaro José Fernández García-Tello</option>
      <option>Dr. José Ferrada Sánchez</option>
      <option>Dra. Maríajose García Sánchez</option>
      <option>Dra. Michelle Ibarra Villagra</option>
      <option>Dr. Cristian Lovera Riquelme</option>
      <option>Dra. Bernardita Millán Rojas</option>
      <option>Dr. Ítalo Muñoz Quintanilla</option>
      <option>Dr. Jorge Navarro Subiabre</option>
      <option>Dra. Romina Oyarzún Díaz</option>
      <option>Dra. Fernanda Salas Pezzani</option>
      <option>Dr. Luis Troncoso Castro</option>
      <option>Dra. Teresa Veas Nanjari</option>
    </select>
    <label>Paciente</label>
    <input type="text" id="patientInput" placeholder="Nombre del paciente…"/>
  </div>

  <div class="mic-section" id="micSection">
    <div class="mic-ring" id="micRing">
      <svg class="ring" viewBox="0 0 110 110">
        <circle cx="55" cy="55" r="45" stroke="#e0eef0" stroke-width="3" fill="none"/>
        <circle class="ring-path" id="ringPath" cx="55" cy="55" r="45"/>
      </svg>
      <button class="mic-btn" id="micBtn" title="Iniciar grabación">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="white">
          <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V20H9v2h6v-2h-2v-2.07A7 7 0 0 0 19 11h-2z"/>
        </svg>
      </button>
    </div>
    <div class="wave" id="wave">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </div>
    <p class="mic-status" id="micStatus">Presiona el micrófono para dictar</p>
    <p class="mic-status" id="recordTimer">⏱ 00:00</p>
  </div>

  <div class="error-banner" id="errorBanner"></div>

  <div class="transcript-section">
    <div class="transcript-header">
      <span>Transcripción</span>
      <div class="transcript-actions">
        <button class="btn-sm" id="copyBtn">📋 Copiar</button>
        <button class="btn-sm primary" id="saveBtn">💾 Guardar</button>
        <button class="btn-sm danger" id="clearBtn">🗑 Borrar</button>
      </div>
    </div>
    <div id="transcriptBox" contenteditable="true" spellcheck="true">
      <span class="marcador-vacio">El texto dictado aparecerá aquí…</span>
    </div>
  </div>

  <div class="history-section">
    <div class="history-header">
      <span>Transcripciones guardadas</span>
      <div class="acciones-historial">
        <button class="btn-sm" id="printHistoryBtn">🖨️ Imprimir Todo</button>
        <button class="btn-sm danger" id="clearHistoryBtn">🗑 Borrar historial</button>
      </div>
    </div>
    <div class="history-list" id="historyList">
      <p class="no-history">Aún no hay transcripciones guardadas.</p>
    </div>
  </div>
</div>

<footer>MediVoz · Para uso interno hospitalario</footer>
<div class="toast" id="toast"></div>

<firma-medivoz></firma-medivoz>

<script src="js/config.js"></script>
<script src="js/script.js"></script>
</body>
</html>
